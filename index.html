<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">

</head><body>
<title>Routine &amp; Performance</title>
<meta name="theme-color" content="#061325">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Sticky top bar + day switcher, one scrolling column (max 760px) of cards, fixed bottom tab bar whose active tab expands into a lime pill. Navy hero cards carry the lime accent in both themes. */
@property --accent{syntax:'<color>';inherits:true;initial-value:#C4FF1E}
@property --hero{syntax:'<color>';inherits:true;initial-value:#0A1A3F}
@property --orb2{syntax:'<color>';inherits:true;initial-value:#3D6BFF}
:root{
  --navy:#0A1A3F; --lime:#C4FF1E; --orb2:#3D6BFF;
  --bg:#FFFFFF; --surface:#F3F6FB; --card:#FFFFFF; --line:#E2E8F3; --soft:#ECF0F8;
  --fg:#0A1A3F; --muted:#5E6C8B;
  --accent:#C4FF1E; --on-accent:#0A1A3F;
  --btn:#0A1A3F; --on-btn:#FFFFFF; --bar:#0A1A3F;
  --hero:#0A1A3F; --hero-fg:#FFFFFF; --hero-muted:#A4B4D8; --hero-line:rgba(255,255,255,.13);
  --good:#15803D; --warn:#B45309; --bad:#C81E1E;
  --good-bg:#E7F7ED; --warn-bg:#FDF2E1; --bad-bg:#FCEBEB;
  --scrim:rgba(5,13,36,.45);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050D24; --surface:#0C1835; --card:#0A1631; --line:#1B2B55; --soft:#14244B;
  --fg:#EEF3FF; --muted:#90A0C6; --btn:var(--accent); --on-btn:#0A1A3F; --bar:var(--accent);
  --hero:#102354; --hero-fg:#FFFFFF; --hero-muted:#A9B8DB; --hero-line:rgba(255,255,255,.13);
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --good-bg:rgba(74,222,128,.12); --warn-bg:rgba(251,191,36,.12); --bad-bg:rgba(248,113,113,.13);
  --scrim:rgba(0,4,16,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050D24; --surface:#0C1835; --card:#0A1631; --line:#1B2B55; --soft:#14244B;
  --fg:#EEF3FF; --muted:#90A0C6; --btn:var(--accent); --on-btn:#0A1A3F; --bar:var(--accent);
  --hero:#102354; --hero-fg:#FFFFFF; --hero-muted:#A9B8DB; --hero-line:rgba(255,255,255,.13);
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --good-bg:rgba(74,222,128,.12); --warn-bg:rgba(251,191,36,.12); --bad-bg:rgba(248,113,113,.13);
  --scrim:rgba(0,4,16,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-inline:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.app{max-width:760px;margin:0 auto;padding-block:0 160px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px 8px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:#3BD16F;box-shadow:0 0 0 3px rgba(59,209,111,.18)}
.sync.saving i{background:var(--warn);animation:blink 1s infinite}
.sync.error i{background:var(--bad)}
.iconbtn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);color:var(--fg);transition:background .2s}
.iconbtn:hover{background:var(--surface)}
.days{display:flex;align-items:center;gap:6px}
.days .iconbtn{width:34px;height:34px;border:0;background:var(--surface)}
.days .iconbtn:disabled{opacity:.3;cursor:default}
.dlabel{flex:1;height:34px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600}
.dlabel em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:2px 7px;border-radius:6px}

/* main */
main{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.enter>*{animation:rise .55s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.enter.from-r>*{animation-name:fromR}.enter.from-l>*{animation-name:fromL}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes fromR{from{opacity:0;transform:translateX(36px) scale(.97)}}
@keyframes fromL{from{opacity:0;transform:translateX(-36px) scale(.97)}}
@keyframes blink{50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h2,.sec-h{margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>h2 .ic{color:var(--fg)}
.h-left{display:flex;align-items:center;gap:8px}
h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.small{font-size:12.5px}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:20px 18px 18px;position:relative;overflow:hidden;isolation:isolate}
.hero .muted,.hero .hm{color:var(--hero-muted)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.hello{font-size:13px;color:var(--hero-muted);font-weight:500}
.clock{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:6px 0 8px;display:flex;align-items:baseline}
.clock .sec{font-size:20px;font-weight:500;color:var(--accent);margin-left:4px;letter-spacing:0}
.clock .colon{animation:blink 2s steps(1) infinite}
.hdate{font-size:15px;font-weight:600;text-transform:capitalize}
.saint{font-size:13px;color:var(--hero-muted);margin-top:2px}
.saint b{color:var(--hero-fg);font-weight:600}
.wx{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 12px 7px 9px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--hero-line);font-size:13px;flex-wrap:wrap}
.wx b{font-size:16px}
.wx .ic{color:var(--accent)}
.score{text-align:center;position:relative}
.score .val{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.score .val b{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.score .val span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-muted);margin-top:3px}
.rot{margin:16px 0 0;font-size:17px;font-weight:600;letter-spacing:-.01em;min-height:1.45em;transition:opacity .45s,transform .45s}
.rot.out{opacity:0;transform:translateY(6px)}
.rot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:10px;vertical-align:2px}
.pulse{position:absolute;right:-10px;bottom:-6px;width:70%;height:80px;z-index:-1;opacity:.5}
.pulse path{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:trace 4.5s cubic-bezier(.4,0,.2,1) infinite}
@keyframes trace{0%{stroke-dashoffset:420}55%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}

/* rings, bars, charts */
.ring .rt{stroke:var(--soft)}
.ring .rv{stroke:var(--bar);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.hero .ring .rt{stroke:var(--hero-line)}
.hero .ring .rv,.ring.lime .rv{stroke:var(--accent)}
.enter .ring .rv{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--c)}}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--bar);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar>i.full{background:var(--accent)}
.bar>i.over{background:var(--bad)}
.hero .bar{background:var(--hero-line)}.hero .bar>i{background:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--bar);opacity:.22}
.chart .b.on{opacity:1}
.chart .bv{fill:var(--fg);font-size:9.5px;font-weight:600;font-family:var(--mono)}
.chart .bl{fill:var(--muted);font-size:10px;font-weight:600}
.chart .bl.on{fill:var(--fg)}
.chart .goal{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
.chart .gl{fill:var(--muted);font-size:9px}
.enter .chart .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(0)}}

/* tiles */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .18s,border-color .18s}
.tile:hover{border-color:var(--muted)}
.tile:active{transform:scale(.98)}
.tl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.tv{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tv small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.ts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.none{background:var(--soft)}

/* controls */
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip .c{font-size:11px;color:var(--muted);font-weight:500}
.chip.on .c{color:var(--on-accent);opacity:.7}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scrollx::-webkit-scrollbar{display:none}
.scrollx>*{flex:none}
.card .scrollx{margin-inline:-16px}
.btn{height:46px;padding:0 18px;border-radius:14px;background:var(--btn);color:var(--on-btn);font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.sm{height:36px;border-radius:11px;padding:0 13px;font-size:13.5px}
.btn:disabled{opacity:.4}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);padding:0 13px;font-size:16px;width:100%;min-width:0;outline:none;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--fg);background:var(--card)}
textarea.inp{height:auto;min-height:110px;padding:11px 13px;resize:vertical;line-height:1.45}
select.inp{appearance:none;-webkit-appearance:none}
.big-inp{font-size:30px;font-weight:700;letter-spacing:-.02em;height:62px;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:8px;align-items:stretch}
.stepper .iconbtn{width:46px;height:auto;border-radius:13px;background:var(--surface);border:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:650;font-variant-numeric:tabular-nums;transition:background .2s,transform .15s}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.seg button:active{transform:scale(.95)}

/* stats */
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat b small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.stat span{font-size:11.5px;color:var(--muted);font-weight:500}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;border-radius:14px;background:var(--surface)}
.hyp{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line);padding-top:10px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:550;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--muted)}
.item .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:650;font-size:14px;white-space:nowrap}
.item .r small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.prow{width:100%;text-align:left;cursor:pointer}
.prow:hover .t{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.add{width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--fg)}
.x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--surface);color:var(--bad)}
.meal-h{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;display:flex;justify-content:space-between}
.meal-h:first-child{margin-top:0}
.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-size:13.5px}

/* rayons */
.rayons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ray{padding:14px;border-radius:15px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px;justify-content:space-between;transition:transform .15s,border-color .2s}
.ray:hover{border-color:var(--muted)}
.ray:active{transform:scale(.98)}
.ray b{font-size:14.5px;line-height:1.25}
.ray span{font-size:12px;color:var(--muted)}
.ray .tag{width:26px;height:4px;border-radius:2px;background:var(--accent)}
.search{position:relative}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .inp{padding-left:40px}

/* checklist */
.check{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.check:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:background .2s,border-color .2s,transform .2s}
.check.on .box{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.check.on .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.check .lbl{flex:1;font-size:14.5px;font-weight:500;transition:color .2s}
.round .box{border-radius:50%}
@keyframes pop{50%{transform:scale(1.18)}}
.leaving{animation:leave .5s cubic-bezier(.4,0,.2,1) forwards;overflow:hidden}
@keyframes leave{0%{opacity:1;max-height:70px}40%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(24px);max-height:0;padding-block:0;border-width:0}}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--muted);white-space:nowrap}
.badge.lime{background:var(--accent);color:var(--on-accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.prio{color:var(--bad)}

/* glasses */
.glasses{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:38px;border-radius:5px 5px 9px 9px;border:1.6px solid var(--line);position:relative;overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--bar);transition:height .4s cubic-bezier(.2,.8,.2,1)}
.glass.on i{height:78%}

/* beer */
.beer-hero .big{font-size:64px;font-weight:750;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.beer-hero .big small{font-size:16px;color:var(--hero-fg);font-weight:600;letter-spacing:0;margin-left:6px}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hero-line)}
.hstats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.hstats span{font-size:11.5px;color:var(--hero-muted)}
.bottles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bottles button{height:52px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;transition:background .2s,transform .15s,color .2s}
.bottles button.on{background:var(--btn);color:var(--on-btn);border-color:transparent}
.bottles button.on.zero{background:var(--accent);color:var(--on-accent)}
.bottles button:active{transform:scale(.93)}
.impact{border-radius:16px;padding:16px;border:1px solid var(--line);transition:background .3s}
.impact.good{background:var(--good-bg);border-color:transparent}
.impact.warn{background:var(--warn-bg);border-color:transparent}
.impact.bad{background:var(--bad-bg);border-color:transparent}
.impact h3{display:flex;align-items:center;gap:8px}
.impact ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.impact li{display:flex;gap:10px;font-size:14px;line-height:1.45}
.impact li::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.5;flex:none;margin-top:7px}
.impact.good h3{color:var(--good)}.impact.warn h3{color:var(--warn)}.impact.bad h3{color:var(--bad)}
.help{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.phone{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.02em;user-select:all}

/* motivation */
.quote blockquote{margin:0;font-size:21px;line-height:1.35;font-weight:550;letter-spacing:-.015em;text-wrap:balance}
.quote cite{display:block;margin-top:10px;font-style:normal;font-size:13px;color:var(--muted)}
.quote .qm{font-size:52px;line-height:.6;color:var(--accent);font-weight:800;display:block;height:22px;-webkit-text-stroke:1px var(--fg)}
.motiv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.motiv{grid-template-columns:minmax(0,1fr)}}
.mcard{border-radius:16px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0;transition:border-color .2s,transform .15s}
a.mcard:hover{border-color:var(--muted)}
.mcard .ml{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mcard .mi{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.mcard b{font-size:15px;line-height:1.3}
.mcard .go{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:auto}
.notice{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--accent);color:var(--on-accent);text-align:left;font-weight:600;font-size:14px;width:100%}
.notice .ic{flex:none}

/* gym */
.ex{padding:13px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.ex:first-child{border-top:0}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-h b{font-size:14.5px}
.ex-h .badge{flex:none}
.ex p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ex-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kg{width:96px;height:38px;font-size:15px;border-radius:11px}
.sets{display:flex;gap:6px}
.set{width:34px;height:34px;border-radius:10px;border:1.6px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);transition:background .2s,transform .15s}
.set.on{background:var(--accent);border-color:transparent;color:var(--on-accent)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:2px}
.nav button{display:flex;align-items:center;gap:6px;height:42px;padding:0 9px;border-radius:999px;color:var(--muted);transition:background .3s,color .3s,padding .3s}
.nav button span{max-width:0;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:650;transition:max-width .35s cubic-bezier(.2,.8,.2,1)}
.nav button.on{background:var(--accent);color:var(--on-accent);padding:0 13px}
.nav button.on span{max-width:84px}
@media (min-width:700px){.nav button span{max-width:84px}.nav button{padding:0 12px}}

/* sheet & toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .28s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:640px;max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.per100{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}
.per100 div{padding:9px;border-radius:12px;background:var(--surface);text-align:center}
.per100 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.per100 span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calc{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px;border-radius:16px;background:var(--hero);color:var(--hero-fg);margin:12px 0}
.calc .k{font-size:34px;font-weight:750;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums}
.calc .k small{font-size:13px;color:var(--hero-fg);margin-left:4px;font-weight:500}
.calc .m{font-size:12.5px;color:var(--hero-muted);text-align:right;line-height:1.6}
.calc .m b{color:var(--hero-fg)}
.fgroup{display:flex;flex-direction:column;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.fgroup:first-of-type{border-top:0;padding-top:0}
.fgroup h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:50;background:var(--btn);color:var(--on-btn);padding:11px 16px;border-radius:13px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:8px}
/* motion & interaction */
.orb{position:absolute;border-radius:50%;filter:blur(34px);z-index:-1;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.orb.o1{width:180px;height:180px;background:var(--accent);opacity:.22;top:-70px;right:-40px}
.orb.o2{width:230px;height:230px;background:var(--orb2);opacity:.38;bottom:-120px;left:-80px;animation-duration:21s;animation-delay:-7s}
.orb.o3{width:90px;height:90px;background:var(--accent);opacity:.16;top:42%;left:52%;animation-duration:12s;animation-delay:-3s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(-26px,18px) scale(1.18)}66%{transform:translate(18px,-14px) scale(.88)}100%{transform:translate(-8px,24px) scale(1.08)}}
.hero .score .ring{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.hero .ring .rv{filter:drop-shadow(0 0 5px var(--accent))}
.btn,.chip,.tile,.seg button,.bottles button,.ray,.mcard,.set,.iconbtn,.mood,.fab{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.4);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;display:block}
.tile,.mcard,.ray{transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .22s}
@media (hover:hover){.tile:hover,.mcard:hover,.ray:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 12px 26px -14px rgba(10,26,63,.45)}}
.btn:active,.iconbtn:active{transform:scale(.93)}
.zoomout{transform:scale(1.07)!important;transition:transform .17s ease-in!important}
.quote{cursor:pointer;transition:transform .2s}
.quote:active{transform:scale(.985)}
.quote .qm{animation:floaty 5s ease-in-out infinite}
.quote .qbody{transition:opacity .22s,transform .22s}
.quote.swap .qbody{opacity:0;transform:scale(.92)}
.mcard .mi{animation:floaty 4.5s ease-in-out infinite}
.mcard:nth-child(2) .mi{animation-delay:-1.5s}.mcard:nth-child(3) .mi{animation-delay:-3s}
@keyframes floaty{50%{transform:translateY(-5px) rotate(-3deg)}}
.nav button.on .ic{animation:nb .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes nb{0%{transform:scale(.5) rotate(-12deg)}100%{transform:scale(1)}}
.check.new .box,.set.new,.bottles button.new,.seg button.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.glass.new i{animation:fill .7s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{height:0}}
a.chip{text-decoration:none}
.tlink{font-weight:600;color:var(--fg);display:inline-flex;align-items:center;gap:3px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;white-space:nowrap}
.chrono{font-variant-numeric:tabular-nums}
.chrono.on{background:var(--btn);color:var(--on-btn);border-color:transparent}
.live-dot{width:8px;height:8px;border-radius:50%;background:#FF5A5A;animation:blink 1s infinite;display:inline-block}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:31;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 12px 28px -10px rgba(10,26,63,.6);animation:bob 3.2s ease-in-out infinite}
.fab:active{animation:none;transform:scale(.88)}
@keyframes bob{50%{transform:translateY(-7px)}}
.eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.eq i{width:4px;border-radius:2px;background:currentColor;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){height:60%;animation-delay:-.2s}.eq i:nth-child(2){height:100%;animation-delay:-.6s}.eq i:nth-child(3){height:45%;animation-delay:-.4s}.eq i:nth-child(4){height:80%;animation-delay:-.8s}
@keyframes eq{50%{transform:scaleY(.3)}}
.moods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mood{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:14px;min-height:112px;border-radius:17px;background:var(--hero);color:var(--hero-fg);text-decoration:none;isolation:isolate;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.mood:hover{transform:scale(1.03)}.mood:active{transform:scale(.95)}
.mood .orb{width:90px;height:90px;filter:blur(24px);top:-34px;right:-26px;opacity:.35}
.mood:nth-child(2n) .orb{background:var(--orb2);opacity:.5}
.mood .mi{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;animation:floaty 4.5s ease-in-out infinite}
.mood:nth-child(2) .mi{animation-delay:-1s}.mood:nth-child(3) .mi{animation-delay:-2s}.mood:nth-child(4) .mi{animation-delay:-3s}.mood:nth-child(5) .mi{animation-delay:-1.6s}
.mood b{display:block;font-size:15px}
.mood span.s{display:block;font-size:12px;color:var(--hero-muted);margin-top:2px}
.mood .go{position:absolute;right:12px;bottom:12px;color:var(--hero-muted)}
:root{transition:--accent 1.8s ease,--hero 1.8s ease,--orb2 1.8s ease}
button.mark{border:0;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
button.mark:active{transform:rotate(-20deg) scale(.85)}
/* tâches */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:16px;padding-top:14px;border-top:1px solid var(--hero-line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:13px;color:var(--hero-muted);transition:background .25s,color .25s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.wd span{font-size:10.5px;font-weight:700;letter-spacing:.06em}
.wd b{font-size:17px;color:var(--hero-fg);font-variant-numeric:tabular-nums}
.wd.today b{color:var(--accent)}
.wd.on{background:var(--accent);color:var(--on-accent);transform:translateY(-3px) scale(1.06)}
.wd.on b{color:var(--on-accent)}
.wd .dots{display:flex;gap:2px;height:8px;align-items:center;color:var(--accent)}
.wd .dots em{width:4px;height:4px;border-radius:50%;background:currentColor}
.wd.on .dots{color:var(--on-accent)}
.next{margin-top:10px;font-size:14px;color:var(--hero-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.next b{color:var(--hero-fg)}
.composer{display:flex;flex-direction:column;gap:12px}
.cmp-row{display:flex;gap:8px}
.cmp-inp{height:56px;font-size:17px;border-radius:16px}
.cmp-add{width:56px;height:56px;padding:0;border-radius:16px;flex:none;background:var(--accent);color:var(--on-accent)}
.parsed{display:flex;flex-wrap:wrap;gap:6px;align-items:center;animation:rise .35s both}
.parsed .pl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--hero);color:var(--hero-fg);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.pchip .ic{color:var(--accent)}
.cmp-opts{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:16px;background:var(--surface);animation:rise .35s both}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sugg{display:flex;flex-direction:column;gap:8px}
.chip.ghosty{background:var(--surface);border-color:transparent}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{position:relative;border-radius:15px;overflow:hidden;background:var(--surface)}
.task-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:700;font-size:13.5px;color:var(--muted);transition:background .2s,color .2s}
.task-bg span{display:flex;align-items:center;gap:6px;opacity:.45;transition:opacity .2s,transform .2s}
.task.go-l .task-bg{background:var(--accent);color:var(--on-accent)}.task.go-l .task-bg span:first-child{opacity:1;transform:scale(1.08)}
.task.go-r .task-bg{background:var(--bad);color:#fff}.task.go-r .task-bg span:last-child{opacity:1;transform:scale(1.08)}
.task-fg{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;background:var(--card);border:1px solid var(--line);border-radius:15px;touch-action:pan-y;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .2s;box-shadow:inset 4px 0 0 var(--cat)}
.task-fg.dragging{transition:none;box-shadow:inset 4px 0 0 var(--cat),0 14px 26px -14px rgba(10,26,63,.45)}
.prio-t .task-fg{border-color:var(--bad)}
.tick{width:26px;height:26px;border-radius:50%;border:1.8px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:background .2s,border-color .2s,color .2s,transform .2s}
.tick:hover{border-color:var(--accent);color:var(--muted)}
.tick:active{transform:scale(.8);background:var(--accent);color:var(--on-accent)}
.task-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.tt{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface);padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.tcat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600}
.tcat i{width:7px;height:7px;border-radius:50%}
.task.leaving{animation:leave2 .45s cubic-bezier(.4,0,.2,1) forwards}
@keyframes leave2{0%{max-height:160px;opacity:1}100%{max-height:0;opacity:0;margin-top:-8px}}
.timeline{display:flex;flex-direction:column;gap:8px}
.tl-row,.nowline{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;align-items:center}
.tl-time{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);text-align:right}
.nowline span{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:6px;padding:2px 4px;text-align:center}
.nowline::after{content:"";height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 2s infinite}
.rt-grid{display:flex;flex-wrap:wrap;gap:8px}
.rt-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;transition:transform .2s,background .2s}
.rt-pill .tick{width:22px;height:22px}
.rt-pill:active{transform:scale(.94)}
.rt-pill.leaving{animation:pop-out .4s forwards}
@keyframes pop-out{to{transform:scale(.6);opacity:0}}
.late>h2{color:var(--bad)}
/* rappel */
.remind{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:55;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 14px;border-radius:18px;background:var(--hero);color:var(--hero-fg);box-shadow:0 18px 40px -16px rgba(5,13,36,.7);transform:translateY(-170%);transition:transform .5s cubic-bezier(.2,1.25,.3,1)}
.remind.open{transform:none}
.remind .bell{width:40px;height:40px;border-radius:13px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;animation:ringb 1.4s ease-in-out infinite}
@keyframes ringb{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.remind .grow{flex:1;min-width:0}.remind .small{color:var(--hero-muted)}
.remind b{font-size:15px}
.remind .ra{display:flex;gap:6px;align-items:center;margin-left:auto}
.remind .chip{background:rgba(255,255,255,.1);border-color:var(--hero-line);color:var(--hero-fg)}
.remind .chip.on{background:var(--accent);color:var(--on-accent)}
.remind .x{color:var(--hero-muted)}
.toast.act{pointer-events:auto}
.tbtn{margin-left:10px;font-weight:750;text-decoration:underline;text-underline-offset:3px}
/* spotify */
.cover{width:46px;height:46px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,hsl(var(--h,200) 85% 55%),hsl(calc(var(--h,200) + 70) 70% 28%))}
.sp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sp-item .btn.sm{flex:none}
.sp-like.on{color:#FF4F6B}
.sp-err{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface)}
.sp-err>div{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sp-gen{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--hero);color:var(--hero-fg);margin:8px 0}
.mood{border:0;text-align:left;font:inherit}
.mood.sel{outline:2px solid var(--accent);outline-offset:2px}
.sk{background:linear-gradient(90deg,var(--soft),var(--surface),var(--soft));background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:6px}
.sk-t{height:12px;width:70%;margin-bottom:7px}.sk-s{height:10px;width:40%}
@keyframes shim{to{background-position:-200% 0}}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--h) 0 50%,var(--a) 50% 100%);border:2px solid var(--line);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.sw.on{border-color:var(--fg);transform:scale(1.12)}
/* zéro alcool */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.sober-pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border-radius:999px;background:var(--hero);color:var(--hero-fg);font-size:12.5px;font-weight:700;white-space:nowrap;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.sober-pill .ic{color:var(--accent);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.15)}}
@media (max-width:440px){.sync span{display:none}.sync{padding:5px 8px}.brand b{display:none}}
.sober-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:20px 18px 18px;color:var(--hero-fg);border:2px solid transparent;background:linear-gradient(var(--hero),var(--hero)) padding-box,conic-gradient(from var(--ang),var(--accent),transparent 25%,var(--orb2),transparent 60%,var(--accent)) border-box;animation:spin 7s linear infinite}
.sober-hero .hello{color:var(--hero-muted)}
.sh-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.sh-big{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.sh-big b{font-size:76px;line-height:.85;font-weight:800;letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums;text-shadow:0 0 30px color-mix(in srgb,var(--accent) 45%,transparent)}
.sh-big>span{font-size:14px;font-weight:650;line-height:1.2;padding-bottom:4px}
.sh-next{margin-top:10px;font-size:13px;color:var(--hero-muted)}.sh-next b{color:var(--hero-fg)}
.sh-msg{margin:14px 0 0;font-size:16.5px;font-weight:600;line-height:1.4;text-wrap:balance}
.sh-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sh-zero{background:var(--accent);color:var(--on-accent);flex:1;min-width:150px}
.sh-sos{background:rgba(255,255,255,.1);color:var(--hero-fg);border:1px solid var(--hero-line);flex:1;min-width:140px}
.sh-ok{display:inline-flex;align-items:center;gap:6px;padding:0 14px;height:46px;border-radius:14px;background:rgba(255,255,255,.08);color:var(--accent);font-weight:700;flex:1}
.pt{position:absolute;bottom:-12px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--accent);opacity:0;z-index:-1;pointer-events:none;animation:rise2 var(--d) linear infinite;animation-delay:var(--dl)}
.pt:nth-child(3n){background:var(--orb2)}
@keyframes rise2{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.75}100%{transform:translateY(-640px) scale(1.15);opacity:0}}
/* écran d'ouverture */
.splash{position:fixed;inset:0;z-index:70;background:var(--hero);color:var(--hero-fg);overflow:auto;transition:opacity .5s ease,transform .5s ease}
.splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.splash-in{position:relative;isolation:isolate;min-height:100%;display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-width:560px;margin:0 auto;overflow:hidden}
.splash .orb.o1{width:320px;height:320px;top:-120px;right:-120px;opacity:.28}.splash .orb.o2{width:360px;height:360px;bottom:-160px;left:-140px}
.sp-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--hero-muted)}
.sp-brand .mark{width:28px;height:28px}
.sp-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.sp-ring{position:relative;width:220px;height:220px;max-width:70vw;max-height:70vw;animation:breathe 4.5s ease-in-out infinite}
.sp-ring svg{width:100%;height:100%}
.sp-ring .ring .rt{stroke:var(--hero-line)}.sp-ring .ring .rv{stroke:var(--accent);filter:drop-shadow(0 0 10px var(--accent));animation:draw 1.6s cubic-bezier(.2,.8,.2,1) both}
.sp-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp-num b{font-size:84px;font-weight:800;line-height:.9;letter-spacing:-.05em;color:var(--accent);font-variant-numeric:tabular-nums;animation:popin .9s cubic-bezier(.3,1.5,.5,1) both}
.sp-num b.j1{font-size:54px}
.sp-num span{font-size:14px;font-weight:600;color:var(--hero-fg);margin-top:6px;max-width:150px}
@keyframes popin{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sp-next{font-size:13.5px;color:var(--hero-muted)}.sp-next b{color:var(--hero-fg)}
.sp-msg{margin:4px 0 0;font-size:20px;font-weight:650;line-height:1.35;max-width:30ch;text-wrap:balance;animation:rise .8s .35s both}
.sp-why{margin:0;font-size:14px;color:var(--hero-muted);animation:rise .8s .55s both}.sp-why b{color:var(--hero-fg)}
.sp-check{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid var(--hero-line);font-weight:650;animation:rise .7s .6s both}
.sp-check .chip{background:rgba(255,255,255,.1);border-color:var(--hero-line);color:var(--hero-fg)}
.sp-check .chip.on{background:var(--accent);color:var(--on-accent)}
.sp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.sp-stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.sp-stats span{font-size:11.5px;color:var(--hero-muted)}
.sp-cta{display:flex;flex-direction:column;gap:8px}
.sp-go{background:var(--accent);color:var(--on-accent);height:54px;font-size:16px}
.splash .btn.ghost,.sos .btn.ghost{background:rgba(255,255,255,.09);color:var(--hero-fg)}
.sp-tap{font-size:12px;color:var(--hero-muted);text-align:center}
/* SOS */
.sos{position:fixed;inset:0;z-index:39;background:var(--hero);color:var(--hero-fg);overflow:auto;opacity:0;transform:scale(.97);transition:opacity .35s,transform .35s}
.sos.open{opacity:1;transform:none}
.sos-in{position:relative;isolation:isolate;min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 22px);overflow:hidden}
.sos .hello{color:var(--hero-muted);font-size:13px;font-weight:600}
.sos-x{border-color:var(--hero-line);color:var(--hero-fg)}
.breath{position:relative;height:260px;display:grid;place-items:center}
.b-circle{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent),color-mix(in srgb,var(--accent) 35%,var(--orb2)));box-shadow:0 0 60px color-mix(in srgb,var(--accent) 55%,transparent);animation:breath 14s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.75)}28.5%{transform:scale(1.8)}57%{transform:scale(1.8)}100%{transform:scale(.75)}}
.b-txt{position:absolute;font-size:20px;font-weight:750;color:var(--on-accent);letter-spacing:.02em}
.sos-timer{text-align:center;display:flex;flex-direction:column;gap:4px}
.sos-timer b{font-size:46px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--accent)}
.sos-timer span{font-size:13.5px;color:var(--hero-muted)}
.sos-why{margin:0;text-align:center;font-size:18px;font-weight:650;min-height:2.6em;transition:opacity .4s}
.sos-alt .small{color:var(--hero-muted);display:block;margin-bottom:8px}
.sos-alt .chip{background:rgba(255,255,255,.08);border-color:var(--hero-line);color:var(--hero-fg)}
.sos-win{background:var(--accent);color:var(--on-accent)}
/* célébration */
.cele{position:fixed;inset:0;z-index:72;display:grid;place-items:center;padding:24px;background:rgba(5,13,36,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .4s}
.cele.open{opacity:1}
.cele-card{width:min(360px,100%);border-radius:28px;padding:28px 22px;text-align:center;background:var(--hero);color:var(--hero-fg);position:relative;overflow:hidden;isolation:isolate;animation:popin .7s cubic-bezier(.3,1.5,.5,1) both}
.cele-card::before{content:"";position:absolute;inset:-50%;z-index:-1;background:conic-gradient(from var(--ang),transparent,color-mix(in srgb,var(--accent) 35%,transparent),transparent 30%);animation:spin 5s linear infinite}
.badge-big{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 50px color-mix(in srgb,var(--accent) 60%,transparent)}
.badge-big b{display:block;font-size:46px;font-weight:800;line-height:1}.badge-big span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:block;margin-top:4px}
.cele-card h3{font-size:24px;margin-bottom:8px}.cele-card p{margin:0 0 18px;color:var(--hero-muted);line-height:1.5}
/* paliers */
.miles{display:flex;flex-direction:column}
.mile{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.mile::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.mile:last-child::before{display:none}
.mile i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card);color:transparent;z-index:1}
.mile.done i{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.mile.done::before{background:var(--accent)}
.mile.cur i{border-color:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.mile b{font-size:14.5px}.mile p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.mile.cur b::after{content:" · en cours";color:var(--muted);font-weight:500}
.why-list{display:flex;flex-direction:column;gap:8px}
.why{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;background:var(--surface);font-weight:600;font-size:14.5px}
.why .grow{flex:1;min-width:0}
.why .n{width:24px;height:24px;border-radius:8px;background:var(--hero);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.proj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.proj div{padding:12px;border-radius:14px;background:var(--surface);text-align:center}
.proj b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.proj span{font-size:11.5px;color:var(--muted)}
.proj em{display:block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.caution{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--warn-bg);color:var(--fg);font-size:13.5px;line-height:1.5}
.caution .ic{color:var(--warn);flex:none;margin-top:2px}
.bank-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.bank-sum div{padding:10px;border-radius:12px;background:var(--surface);text-align:center}
.bank-sum b{display:block;font-variant-numeric:tabular-nums}.bank-sum span{font-size:11.5px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5}
/* v5 : reflets, défilement, budget, photos */
.hero::after,.sober-hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.13) 46%,transparent 62%);transform:translateX(-110%);animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,68%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
.scrollbar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--accent);box-shadow:0 0 10px var(--accent);z-index:26;pointer-events:none}
.alloc{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0 10px}
.alloc i{display:block;height:100%;transform-origin:0 50%;animation:growx .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:3px}
.env{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.env:first-child{border-top:0}
.env-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.env-h b{font-size:14.5px;display:flex;align-items:center;gap:8px}.env-h b i{width:10px;height:10px;border-radius:4px}
.env-h .num{font-size:13.5px;font-weight:650}
.env-bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.env-bar>i{display:block;height:100%;border-radius:inherit;animation:fillw 1.1s cubic-bezier(.2,.8,.2,1) both}
.env-bar>i.over{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)!important;animation:fillw 1.1s cubic-bezier(.2,.8,.2,1) both,stripes 1s linear infinite}
@keyframes fillw{from{width:0}}
@keyframes stripes{to{background-position:24px 0}}
.env-s{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:10px}
.env-s .bad{color:var(--bad);font-weight:700}.env-s .good{color:var(--good);font-weight:650}
.env-tip{font-size:12.5px;color:var(--muted);line-height:1.45}
.save-box{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--hero);color:var(--hero-fg);margin-top:4px;position:relative;overflow:hidden;isolation:isolate}
.save-box b{font-size:26px;color:var(--accent);font-variant-numeric:tabular-nums}
.save-box .sb-sub{font-size:12.5px;color:var(--hero-muted)}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tips li{display:flex;gap:10px;font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--surface);animation:rise .5s both}
.tips li .ic{color:var(--fg);flex:none;margin-top:1px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:8px;background:rgba(5,13,36,.65);color:#fff;display:grid;place-items:center}
.motiv-ov{position:fixed;inset:0;z-index:48;display:grid;place-items:center;padding:20px;background:rgba(5,13,36,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .5s}
.motiv-ov.open{opacity:1}
.motiv-card{position:relative;width:min(420px,100%);height:min(620px,82vh);border-radius:28px;overflow:hidden;background:var(--hero);color:#fff;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);transform:scale(.92) translateY(14px);transition:transform .6s cubic-bezier(.2,1.2,.3,1)}
.motiv-ov.open .motiv-card{transform:none}
.motiv-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 30s ease-out both}
@keyframes kenburns{0%{transform:scale(1.18) translate(2%,2%)}100%{transform:scale(1) translate(0,0)}}
.motiv-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,36,.15) 0%,transparent 35%,rgba(5,13,36,.85) 100%)}
.motiv-top{position:absolute;left:16px;right:16px;top:14px;z-index:2;display:flex;flex-direction:column;gap:10px}
.motiv-prog{height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.motiv-prog i{display:block;height:100%;background:var(--accent);transform-origin:0 50%;animation:prog 30s linear both}
@keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.motiv-top .between .chip{background:rgba(5,13,36,.45);border-color:rgba(255,255,255,.25);color:#fff;height:30px;font-size:12.5px}
.motiv-x{width:34px;height:34px;border-radius:11px;background:rgba(5,13,36,.45);color:#fff;display:grid;place-items:center}
.motiv-msg{position:absolute;left:20px;right:20px;bottom:22px;z-index:2;display:flex;flex-direction:column;gap:12px}
.motiv-msg p{margin:0;font-size:25px;line-height:1.25;font-weight:750;letter-spacing:-.015em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.45);animation:rise .9s .3s both}
.motiv-msg .row{display:flex;gap:8px}
.motiv-msg .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.motiv-msg .chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.motiv-noimg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,var(--orb2),transparent 60%),radial-gradient(circle at 80% 80%,var(--accent),transparent 55%),var(--hero);animation:kenburns 30s ease-out both}
/* v8 : swipe photos, onglet Photos, avant/après */
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
.motiv-card{touch-action:none;user-select:none;-webkit-user-select:none}
.motiv-card.drag{transition:none!important}
.motiv-card.fly{transition:transform .45s ease-in,opacity .45s ease-in!important}
.stamp{position:absolute;top:96px;z-index:3;padding:6px 14px;border:3px solid;border-radius:12px;font-size:26px;font-weight:900;letter-spacing:.06em;opacity:0;pointer-events:none;background:rgba(5,13,36,.35)}
.stamp.like{left:22px;color:var(--accent);border-color:var(--accent);transform:rotate(-14deg)}
.stamp.nope{right:22px;color:#FF6B85;border-color:#FF6B85;transform:rotate(14deg)}
.sw-row{display:flex;justify-content:center;align-items:center;gap:18px}
.sw-btn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;transition:transform .2s}
.sw-btn.like{background:var(--accent);color:var(--on-accent);border-color:transparent;width:72px;height:72px;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 50%,transparent)}
.sw-btn.nope{color:#FF8A9E}
.sw-btn:active{transform:scale(.86)}
.sw-hint{font-size:12px;color:rgba(255,255,255,.75);text-align:center}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph-tile{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft);max-width:100%;animation:popin .5s both;cursor:pointer}
.ph-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.ph-tile:hover img{transform:scale(1.06)}
.ph-tag{position:absolute;left:6px;bottom:6px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:6px;background:rgba(5,13,36,.7);color:#fff}
.ph-tag.sober{background:var(--accent);color:var(--on-accent)}
.ph-tag.alc{background:#FF5A7A;color:#fff}
.ph-fav{position:absolute;right:6px;top:6px;color:#FF5A7A;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.vs{position:relative;aspect-ratio:3/4;max-height:66vh;border-radius:18px;overflow:hidden;background:var(--soft);max-width:100%;margin:0 auto;touch-action:pan-y}
.vs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vs .top{clip-path:inset(0 calc(100% - var(--p,50%)) 0 0)}
.vs .line{position:absolute;top:0;bottom:0;left:var(--p,50%);width:3px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.5);transform:translateX(-50%);pointer-events:none}
.vs .line::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.vs .lab{position:absolute;bottom:10px;font-size:11px;font-weight:800;text-transform:uppercase;padding:4px 8px;border-radius:7px;pointer-events:none}
.vs .lab.l{left:10px;background:#FF5A7A;color:#fff}.vs .lab.r{right:10px;background:var(--accent);color:var(--on-accent)}
.vs input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cols h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.cols .ph-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.nav button{padding:0 7px}.nav button.on{padding:0 12px}.nav button.on span{max-width:78px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const LS_KEY='rp-tracker-v1';
const S={db:null,base:null,sync:'connecting',docs:{},settings:clone(DEF),todos:{items:[]},meteo:null,sel:TODAY(),tab:'home',nut:{r:null,s:null,q:''},sheet:null,chart:'score',ro:false};
const blank=id=>({date:id,steps:0,swim:0,gym:null,food:[],beer:null,bp:null,hyg:{},water:0,sleep:null,sq:null,mood:null,energy:null,exp:[],rt:{},defi:false,swimMin:0,timer:null});

function apply(id,v){
  if(id==='settings')S.settings={...clone(DEF),...v};

/* ---------- persistence: local cache + db sync ---------- */
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(j){for(const[id,v]of Object.entries(j.docs||{}))apply(id,v);if(j.settings)apply('settings',j.settings);if(j.todos)apply('todos',j.todos);if(j.meteo)S.meteo=j.meteo}}catch(e){}}
let lsT;function lsSave(){clearTimeout(lsT);lsT=setTimeout(()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({docs:S.docs,settings:S.settings,todos:S.todos,meteo:S.meteo}))}catch(e){}},250)}
const dirty=new Map(),timers={},writing={},retried={};
function bodyOf(id){if(id==='settings')return S.settings;if(id==='todos')return S.todos;return S.docs[id]}
function save(id){
  if(S.ro){toast("Lecture seule : modification non enregistrée");return}
  dirty.set(id,(dirty.get(id)||0)+1);lsSave();
  if(!S.db)return;
  setSync('saving');clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),650);
}
async function flush(id){
  if(writing[id]){timers[id]=setTimeout(()=>flush(id),350);return}
  const v=dirty.get(id);if(v==null)return;
  const body=JSON.parse(JSON.stringify(bodyOf(id)||{}));
  writing[id]=true;
  try{await S.db.doc(S.base+'/'+id).set(body);retried[id]=0;if(dirty.get(id)===v)dirty.delete(id)}
  catch(e){
    const c=e&&e.code;
    if((c==='unavailable'||c==='resource_exhausted')&&!retried[id]){retried[id]=1;writing[id]=false;timers[id]=setTimeout(()=>flush(id),900+Math.random()*900);return}
    if(c==='quota_exceeded')toast("Stockage plein : supprime d'anciennes données.");
    else if(c==='invalid_argument'){S.ro=true;toast("Enregistrement refusé : accès en lecture seule.")}
    setSync('error');writing[id]=false;return;
  }
  writing[id]=false;
  if(!dirty.size)setSync('ok');
}
function setSync(s){S.sync=s;const el=$('#sync');if(!el)return;el.className='sync '+s;el.querySelector('span').textContent={connecting:'Connexion…',ok:'Synchronisé',saving:'Enregistrement…',local:'Sur cet appareil',error:'Non synchronisé'}[s]||s}
async function connect(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){setSync('local');return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([cl.use('db'),cl.use('user')])}catch(e){}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  if(!db||!uid){setSync('local');return}
  S.db=db;S.base='data/users/'+uid;
  try{
    db.collection(S.base).onSnapshot(snap=>{
      let changed=false;
      for(const ch of snap.docChanges()){
        const id=ch.doc.id;if(dirty.has(id))continue;
        if(ch.type==='removed'){if(S.docs[id]){delete S.docs[id];changed=true}continue}
        const v=ch.doc.data();if(v){apply(id,v);changed=true}
      }
      if(!dirty.size&&S.sync!=='error')setSync('ok');
      if(changed){lsSave();softRender()}
    },err=>{setSync('error')});
    setSync('ok');
  }catch(e){setSync('error')}
}

/* ---------- calculations ---------- */
function nutri(d){let k=0,p=0,g=0,l=0,e=0;for(const x of d.food||[]){k+=x.kc;p+=x.pr;g+=x.gl;l+=x.li;e+=x.eur}const bk=(d.beer||0)*BEER.kcal;return{k:k+bk,food:k,beerK:bk,p,g,l,eur:e}}
function act(d,st){
  const kg=st.kg,stride=st.cm/100*0.47,km=(d.steps||0)*stride/1000,wh=km/st.walkKmh,wm=interp(WALK_MET,st.walkKmh);
  const sm=d.swim||0,sh=sm/100*st.swimPace/3600,sv=6000/st.swimPace,smet=interp(SWIM_MET,sv)*(st.pullBuoy?0.88:1)*(st.poolTemp<=22?1.05:1);
  const gmin=(d.gym&&d.gym.min)||0,gh=gmin/60;
  const w={km,h:wh,kcal:wm*kg*wh,net:(wm-1)*kg*wh,met:wm},s={m:sm,h:sh,kcal:smet*kg*sh,net:(smet-1)*kg*sh,met:smet,v:sv},g={min:gmin,kcal:GYM_MET*kg*gh,net:(GYM_MET-1)*kg*gh};
  return{w,s,g,kcal:w.kcal+s.kcal+g.kcal,net:w.net+s.net+g.net};
}
const bmr=st=>10*st.kg+6.25*st.cm-5*st.age+(st.sex==='F'?-161:5);
function balance(d,st){const n=nutri(d),a=act(d,st),out=bmr(st)*1.2+a.net;return{inK:n.k,out,diff:n.k-out}}
function tasksFor(id){
  const st=S.settings,items=S.todos.items||[],d=S.docs[id]||blank(id);
  const rel=items.filter(t=>t.c<=id&&(!t.d||t.d>=id));
  const done=rel.filter(t=>t.d===id).length+st.routine.filter(r=>d.rt&&d.rt[r]).length;
  const total=rel.length+st.routine.length;
  return{done,total,open:total-done};
}
function score(d,st){
  const hy=st.hyg.length?st.hyg.filter(h=>d.hyg&&d.hyg[h]).length/st.hyg.length:0;
  const t=tasksFor(d.date),tk=t.total?t.done/t.total:0;
  const sp=Math.min(1,act(d,st).kcal/450);
  const n=nutri(d),nu=n.food>0?Math.max(0,1-Math.abs(n.k-st.kcalGoal)/st.kcalGoal*1.5):0;
  const al=d.beer==null?0.5:d.beer===0?1:d.beer===1?0.35:0;
  const w=Math.min(1,(d.water||0)/st.waterGoal);
  return Math.round(hy*18+tk*18+sp*22+nu*18+al*16+w*8);
}
function monthStats(ym){
  const st=S.settings;let food=0,beer=0,man=0;const cats={},daily={};
  for(const[id,d]of Object.entries(S.docs)){if(!id.startsWith(ym))continue;
    const f=(d.food||[]).reduce((a,x)=>a+x.eur,0),b=(d.beer||0)*(d.bp!=null?d.bp:st.beerPrice),m=(d.exp||[]).reduce((a,x)=>a+x.a,0);
    food+=f;beer+=b;man+=m;for(const x of d.exp||[])cats[x.c]=(cats[x.c]||0)+x.a;daily[id]=f+b+m}
  return{food,beer,man,cats,daily,total:food+beer+man};
}
function beerStats(id){
  const st=S.settings;let streak=0,cur=id;const d0=S.docs[id];
  if(!d0||d0.beer==null)cur=addDays(id,-1);
  while(S.docs[cur]&&S.docs[cur].beer===0){streak++;cur=addDays(cur,-1)}
  const ym=id.slice(0,7);let free=0,logged=0,spent=0,bottles=0;
  for(const[k,d]of Object.entries(S.docs)){if(!k.startsWith(ym)||k>id||d.beer==null)continue;logged++;if(d.beer===0)free++;bottles+=d.beer;spent+=d.beer*(d.bp!=null?d.bp:st.beerPrice)}
  const baseline=st.beerBase*logged/7*st.beerPrice;
  let week=0;for(let i=0;i<7;i++){const d=S.docs[addDays(id,-i)];if(d&&d.beer)week+=d.beer}
  return{streak,free,logged,spent,bottles,saved:Math.max(0,baseline-spent),weekStd:week*BEER.std};
}
function lastGym(beforeId){
  const ids=Object.keys(S.docs).filter(k=>/^\d{4}/.test(k)&&k<beforeId&&S.docs[k].gym&&S.docs[k].gym.s).sort();
  return ids.length?S.docs[ids[ids.length-1]].gym:null;
}
function lastWeight(k,beforeId){
  const ids=Object.keys(S.docs).filter(x=>/^\d{4}/.test(x)&&x<beforeId).sort().reverse();
  for(const id of ids){const g=S.docs[id].gym;if(g&&g.ex&&g.ex[k]&&g.ex[k].w)return{w:g.ex[k].w,n:g.ex[k].n||0,id}}
  return null;
}

    const f=x=>{const v=dec?nf1.format(x):nf0.format(Math.round(x));return sign&&x>0?'+'+v:v};
    (function tick(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(tick);else el.textContent=f(to)})(t0)});

function chart(vals,labels,sel,goal,fmt){

  vals.forEach((v,i)=>{const x=gap/2+i*(bw+gap),h=(H-pt-pb)*(v/max),y=H-pb-h;
    s+=`<rect x="${x.toFixed(1)}" y="${(v>0?y:H-pb-2).toFixed(1)}" width="${bw}" height="${Math.max(h,2).toFixed(1)}" rx="6" class="b${i===sel?' on':''}" style="--d:${i*55}ms"/>`;
    if(v>0)s+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" class="bv">${fmt(v)}</text>`;

}

/* ---- Bière ---- */
function impact(n,price){
  if(n==null)return{l:'',t:"Note ta consommation du jour",li:["Un tap suffit. Un suivi honnête, même les jours difficiles, est ce qui fait avancer."]};
  if(n===0)return{l:'good',t:"Journée sans alcool",li:["Sommeil plus profond et plus réparateur cette nuit.","Humeur plus stable et moins d'anxiété demain.",`${eur(price)} et ${BEER.kcal} kcal évités par bouteille non bue.`]};
  const std=Math.round(n*BEER.std),k=i0(n*BEER.kcal),c=eur(n*price);
  if(n===1)return{l:'warn',t:`1 bouteille ≈ ${std} verres standard`,li:["2,5 fois le repère maximal d'une journée (2 verres standard).","L'alcool fait s'endormir vite mais fragmente le sommeil et réduit le sommeil paradoxal : fatigue, irritabilité et moral plus bas le lendemain.",`${k} kcal et ${c} dépensés.`]};
  if(n===2)return{l:'bad',t:`2 bouteilles ≈ ${std} verres standard`,li:["L'équivalent de tout le repère d'une semaine (10 verres) en une seule journée.","Le lendemain : anxiété de rebond, motivation et concentration en baisse, envie de recommencer pour « se sentir mieux ».",`${k} kcal et ${c} dépensés.`]};
  if(n===3)return{l:'bad',t:`3 bouteilles ≈ ${std} verres standard`,li:["Consommation à risque élevé. L'alcool est un dépresseur du système nerveux : répété, ce niveau augmente nettement le risque d'anxiété et de dépression.","Mémoire, jugement et sommeil restent perturbés plusieurs jours.",`${k} kcal et ${c} dépensés.`]};
  return{l:'bad',t:`${n} bouteilles ≈ ${std} verres standard`,li:["Niveau très élevé, avec un risque d'intoxication aiguë.","À ce niveau, réduire seul est difficile : en parler à un médecin ou à Alcool Info Service aide vraiment, sans jugement.",`${k} kcal et ${c} dépensés.`]};
}

function closeSheet(){const el=$('#sheet'),sc=$('#scrim');el.classList.remove('open');sc.classList.remove('open');S.sheet=null;setTimeout(()=>{if(!S.sheet){el.hidden=true;sc.hidden=true;el.innerHTML=''}},340)}

    <div class="scrollx" style="margin-top:10px">${chips.map(x=>`<button class="chip ${Math.round(sh.q)===Math.round(x[0])?'on':''}" data-a="qSet" data-v="${x[0]}">${x[1]?esc(x[1])+' · ':''}${i0(x[0])} g</button>`).join('')}</div>

  } else if(sh.k==='custom'){
    el.innerHTML=`<div class="grab"></div><div class="sheet-h"><div><h3>Produit perso</h3><p>Valeurs pour 100 g, lues sur l'étiquette</p></div><button class="iconbtn" data-a="close" aria-label="Fermer">${ic('x',18)}</button></div>
    <div class="stack"><label class="field"><span>Nom</span><input class="inp" id="cN" placeholder="Ex. Skyr vanille U"></label>
    <div class="grid2"><label class="field"><span>Kcal</span><input class="inp" id="cK" inputmode="decimal"></label><label class="field"><span>Protéines (g)</span><input class="inp" id="cP" inputmode="decimal"></label><label class="field"><span>Glucides (g)</span><input class="inp" id="cG" inputmode="decimal"></label><label class="field"><span>Lipides (g)</span><input class="inp" id="cL" inputmode="decimal"></label><label class="field"><span>Prix (€/kg)</span><input class="inp" id="cPr" inputmode="decimal"></label><label class="field"><span>Portion (g)</span><input class="inp" id="cPo" inputmode="decimal" value="100"></label></div>
    <button class="btn block" data-a="customSave">Enregistrer le produit</button></div>`;
  } else if(sh.k==='photo'){
    const h=vPhotoSheet(sh.pk);if(!h){closeSheet();return}el.innerHTML=h;
  } else if(sh.k==='music'){
    el.innerHTML=vMusic();
  } else if(sh.k==='task'){
    const h=vTaskSheet(sh.id);if(!h){closeSheet();return}el.innerHTML=h;

    <div class="fgroup"><h4>Listes</h4><label class="field"><span>Routine quotidienne (une tâche par ligne)</span><textarea class="inp" id="set-routine" data-ch="list" data-k="routine">${esc(st.routine.join('\n'))}</textarea></label><label class="field"><span>Checklist hygiène (un élément par ligne)</span><textarea class="inp" id="set-hyg" data-ch="list" data-k="hyg">${esc(st.hyg.join('\n'))}</textarea></label></div>
    <p class="hint">${S.db?'Tes données sont privées et synchronisées sur ton compte : ouvre l\'appli sur ton téléphone ou ton ordinateur, tout suit.':'Synchronisation indisponible ici : les données restent sur cet appareil.'}</p>`;
  }
}

/* ---------- mutations ---------- */
function mutDay(fn,liveKeys){const d=day(S.sel);fn(d);save(S.sel);if(liveKeys)live(...liveKeys);else render()}
function mutSet(fn,rerender=true){fn(S.settings);save('settings');if(rerender)render()}
function mutTodos(fn){fn(S.todos);const cut=addDays(TODAY(),-90);S.todos.items=S.todos.items.filter(x=>!x.d||x.d>=cut);save('todos');render()}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function leaveThen(el,fn){if(!el||matchMedia('(prefers-reduced-motion: reduce)').matches){fn();return}el.classList.add('leaving');setTimeout(fn,480)}

const ACT={
  tab(t){const v=t.dataset.v;if(S.tab===v&&v==='food'){S.nut={r:null,s:null,q:''}}S.tab=v;window.scrollTo({top:0,behavior:'instant'in document.documentElement.style?'instant':'auto'});render(true)},
  prev(){S.sel=addDays(S.sel,-1);render(true)},
  next(){if(S.sel<TODAY()){S.sel=addDays(S.sel,1);render(true)}},
  today(){if(S.sel!==TODAY()){S.sel=TODAY();render(true)}},
  settings(){openSheet({k:'settings'})},
  close(){closeSheet()},
  chart(t){S.chart=t.dataset.v;render()},
  defi(){mutDay(d=>{d.defi=!d.defi});if(day(S.sel).defi)toast('Défi relevé. Bravo !')},
  ray(t){S.nut.r=+t.dataset.v;S.nut.s=null;live('results')},
  rayBack(){S.nut.r=null;S.nut.s=null;live('results')},
  sub(t){S.nut.s=t.dataset.v===''?null:+t.dataset.v;live('results')},
  prod(t){const p=getProd(t.dataset.v);if(!p)return;openSheet({k:'prod',id:p[0],q:p[8]||100,m:defaultMeal()})},
  qStep(t){S.sheet.q=Math.max(0,(S.sheet.q||0)+ +t.dataset.v);const i=$('#sheetQ');if(i)i.value=i0(S.sheet.q);live('calc')},
  qSet(t){S.sheet.q=+t.dataset.v;renderSheet()},
  meal(t){S.sheet.m=+t.dataset.v;renderSheet()},
  addFood(){const sh=S.sheet,p=getProd(sh.id);if(!p||!(sh.q>0)){toast('Indique une quantité');return}const e=entryFrom(p,sh.q,sh.m);mutDay(d=>{d.food=(d.food||[]).concat([e])});closeSheet();toast(`${i0(e.kc)} kcal ajoutées · ${MEALS[e.m]}`)},
  delFood(t){const i=+t.dataset.v;mutDay(d=>{d.food=(d.food||[]).filter((_,k)=>k!==i)})},
  custom(){openSheet({k:'custom'})},
  customSave(){const n=$('#cN').value.trim();if(!n){toast('Donne un nom au produit');return}const c={id:'c'+Date.now().toString(36),n,k:num($('#cK').value),p:num($('#cP').value),g:num($('#cG').value),l:num($('#cL').value),pr:num($('#cPr').value),po:num($('#cPo').value)||100};mutSet(st=>{st.custom=(st.custom||[]).concat([c])},false);openSheet({k:'prod',id:c.id,q:c.po,m:defaultMeal()});render()},
  steps(t){mutDay(d=>{d.steps=Math.max(0,(d.steps||0)+ +t.dataset.v)},['walk','sportTotal']);const i=$('#steps');if(i)i.value=day(S.sel).steps||''},
  swimSet(t){mutDay(d=>{d.swim=+t.dataset.v})},
  gymView(t){const v=t.dataset.v;const d=day(S.sel);if(d.gym&&d.gym.s&&d.gym.s!==v&&gymSets(d)>0){S.gymView=v;mutDay(x=>{x.gym={s:v,min:x.gym.min||0,ex:{}}});return}S.gymView=v;if(d.gym&&d.gym.s&&d.gym.s!==v)mutDay(x=>{x.gym.s=v;x.gym.ex={}});else render()},
  set(t){const k=t.dataset.k,i=+t.dataset.v,show=(day(S.sel).gym&&day(S.sel).gym.s)||S.gymView||nextGym();mutDay(d=>{if(!d.gym||d.gym.s!==show)d.gym={s:show,min:(d.gym&&d.gym.min)||0,ex:{}};const ex=d.gym.ex[k]||(d.gym.ex[k]={});if(ex.w==null){const lw=lastWeight(k,S.sel);if(lw)ex.w=lw.w}ex.n=(ex.n===i+1)?i:i+1})},
  hyg(t){const v=t.dataset.v;mutDay(d=>{d.hyg={...d.hyg,[v]:!d.hyg[v]}})},
  water(t){mutDay(d=>{d.water=Math.max(0,(d.water||0)+ +t.dataset.v)})},
  scale(t){const k=t.dataset.k,v=+t.dataset.v;mutDay(d=>{d[k]=d[k]===v?null:v})},
  beer(t){const v=+t.dataset.v;mutDay(d=>{if(d.beer===v){d.beer=null;d.bp=null}else{d.beer=v;d.bp=S.settings.beerPrice}});if(v===0&&day(S.sel).beer===0)toast('Zéro aujourd\'hui. Bien joué.')},
  copyTel(){const n='0980980930';try{navigator.clipboard.writeText(n).then(()=>toast('Numéro copié'),()=>toast('0 980 980 930'))}catch(e){toast('0 980 980 930')}},
  expCat(t){S.expCat=t.dataset.v;document.querySelectorAll('#expCats .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===S.expCat))},
  expAdd(){const a=num($('#expA').value),l=$('#expL').value.trim();if(!(a>0)){toast('Indique un montant');return}mutDay(d=>{d.exp=(d.exp||[]).concat([{l,a:r2(a),c:S.expCat||'Courses'}])});toast(`${eur(a)} ajoutés`)},
  expDel(t){const id=t.dataset.d,i=+t.dataset.v,d=S.docs[id];if(!d)return;d.exp=(d.exp||[]).filter((_,k)=>k!==i);save(id);render()},
  prio(){S.prio=!S.prio;const b=document.querySelector('[data-a="prio"]');if(b){b.classList.toggle('prio',S.prio);b.style.borderColor=S.prio?'var(--bad)':'';b.setAttribute('aria-pressed',S.prio)}},
  todoAdd(){const i=$('#todoText'),t=i&&i.value.trim();if(!t){i&&i.focus();return}const p=!!S.prio;S.prio=false;mutTodos(x=>{x.items=(x.items||[]).concat([{id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,c:S.sel,d:null,p}])});const n=$('#todoText');if(n)n.focus()},
  todoDone(t){const id=t.dataset.v;leaveThen(document.getElementById('row-'+id),()=>{mutTodos(x=>{const it=x.items.find(y=>y.id===id);if(it)it.d=S.sel});toast('Tâche terminée')})},
  todoUndo(t){const id=t.dataset.v;mutTodos(x=>{const it=x.items.find(y=>y.id===id);if(it)it.d=null})},
  todoDel(t){const id=t.dataset.v;leaveThen(document.getElementById('row-'+id),()=>mutTodos(x=>{x.items=x.items.filter(y=>y.id!==id)}))},
  rt(t){const v=t.dataset.v;leaveThen(t,()=>{mutDay(d=>{d.rt={...d.rt,[v]:true}});toast('Fait')})},
  rtUndo(t){const v=t.dataset.v;mutDay(d=>{const r={...d.rt};delete r[v];d.rt=r})},
  showDone(t){S.showDone=!t.open},
  sex(t){mutSet(st=>{st.sex=t.dataset.v;st.profileSet=true},false);renderSheet();render()},
  pb(t){mutSet(st=>{st.pullBuoy=t.dataset.v==='1'},false);renderSheet();render()},
};
function nextGym(){const l=lastGym(S.sel);return l?({A:'B',B:'C',C:'A'}[l.s]||'A'):'A'}
const IN={
  q(t){S.nut.q=t.value;live('results')},
  steps(t){mutDay(d=>{d.steps=Math.max(0,Math.round(num(t.value)))},['walk','sportTotal'])},
  swim(t){mutDay(d=>{d.swim=Math.max(0,Math.round(num(t.value)))},['swim','sportTotal'])},
  gymMin(t){const v=Math.max(0,Math.round(num(t.value))),show=(day(S.sel).gym&&day(S.sel).gym.s)||S.gymView||nextGym();mutDay(d=>{if(!d.gym||d.gym.s!==show)d.gym={s:show,min:0,ex:(d.gym&&d.gym.s===show&&d.gym.ex)||{}};d.gym.min=v},['gym','sportTotal'])},
  kg(t){const k=t.dataset.k,v=t.value.trim()===''?null:num(t.value),show=(day(S.sel).gym&&day(S.sel).gym.s)||S.gymView||nextGym();mutDay(d=>{if(!d.gym||d.gym.s!==show)d.gym={s:show,min:(d.gym&&d.gym.min)||0,ex:{}};const ex=d.gym.ex[k]||(d.gym.ex[k]={n:0});ex.w=v},[])},
  sleep(t){const v=t.value.trim()===''?null:clamp(num(t.value),0,16);mutDay(d=>{d.sleep=v},['sleep'])},
  sheetQ(t){S.sheet.q=Math.max(0,num(t.value));live('calc')},
  sheetPrice(t){const p=getProd(S.sheet.id);if(!p)return;const v=num(t.value);mutSet(st=>{st.prices={...(st.prices||{}),[p[0]]:r2(v)}},false);live('calc')},
};
const CH={
  set(t){const k=t.dataset.k;let v=t.value;if(k==='swimPace')v=clamp(parsePace(v),45,240);else v=num(v);
    const lim={kg:[30,250],cm:[120,230],age:[12,100],kcalGoal:[1000,6000],stepsGoal:[1000,50000],waterGoal:[1,20],budget:[0,100000],walkKmh:[3,9],poolTemp:[10,35],beerPrice:[0,30],beerBase:[0,100]}[k];
    if(lim)v=clamp(v,lim[0],lim[1]);mutSet(st=>{st[k]=v;if(['kg','cm','age'].includes(k))st.profileSet=true},false);render();

  list(t){const k=t.dataset.k,arr=t.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40);mutSet(st=>{st[k]=arr},false);render()},

document.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.tagName==='DETAILS')return;
  const a=t.dataset.a;if(ACT[a]){e.preventDefault();ACT[a](t,e)}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-a="showDone"]'))S.showDone=e.target.open},true);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in&&IN[t.dataset.in])IN[t.dataset.in](t)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ch&&CH[t.dataset.ch])CH[t.dataset.ch](t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='todoText'){e.preventDefault();ACT.todoAdd()}else if(e.target.id==='expA'||e.target.id==='expL'){e.preventDefault();ACT.expAdd()}else if(e.target.id==='sheetQ'){e.preventDefault();ACT.addFood()}}if(e.key==='Escape'&&S.sheet)closeSheet()});
