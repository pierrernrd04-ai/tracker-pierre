function tasksFor(id){const st=S.settings,d=S.docs[id]||blank(id),rel=relTasks(id);const done=rel.filter(t=>t.d===id).length+st.routine.filter(r=>d.rt&&d.rt[r]).length,total=rel.length+st.routine.length;return{done,total,open:total-done}}
function nextTask(){const T=TODAY(),now=nowHM();return relTasks(T).filter(x=>!x.d&&x.due===T&&x.time&&x.time>=now).sort((a,b)=>a.time.localeCompare(b.time))[0]||null}
function untilStr(x){const[h,m]=x.time.split(':').map(Number),tg=new Date();tg.setHours(h,m,0,0);const mins=Math.round((tg-Date.now())/6e4);return mins<=0?'maintenant':mins<60?`dans ${mins} min`:`dans ${Math.floor(mins/60)} h ${String(mins%60).padStart(2,'0')}`}
function gcalUrl(x){if(!x.due)return null;const f=d=>dayId(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';let dates;
  if(x.time){const[h,m]=x.time.split(':').map(Number),s=parseId(x.due);s.setHours(h,m,0,0);const e=new Date(s.getTime()+30*6e4);dates=f(s)+'/'+f(e)}else dates=x.due.replace(/-/g,'')+'/'+addDays(x.due,1).replace(/-/g,'');
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.t)+'&dates='+dates+'&ctz=Europe%2FParis';
  if(x.note)u+='&details='+encodeURIComponent(x.note);
  if(x.rec)u+='&recur='+encodeURIComponent('RRULE:'+(x.rec==='d'?'FREQ=DAILY':x.rec==='w'?'FREQ=WEEKLY':'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'));
  return u}
function taskRow(x,opt={}){
  const late=x.due&&x.due<S.sel&&!x.d,col=CATS[x.cat]||CATS.Perso,meta=[];
  if(opt.showDate&&x.due)meta.push(`<span class="tchip">${ic('cal',12)} ${esc(relDay(x.due))}</span>`);
  if(x.time&&!opt.hideTime)meta.push(`<span class="tchip">${ic('timer',12)} ${x.time}</span>`);
  if(x.rem!=null&&x.due)meta.push(`<span class="tchip">${ic('bell',12)} ${esc(remLabel(x.rem))}</span>`);
  if(x.rec)meta.push(`<span class="tchip">${ic('repeat',12)} ${esc(RECS[x.rec]||'')}</span>`);
  if(x.note)meta.push(`<span class="tchip">${ic('note',12)}</span>`);
  meta.push(`<span class="tcat"><i style="background:${col}"></i>${esc(x.cat||'Perso')}</span>`);
  if(late)meta.push(`<span class="badge warn">En retard · ${esc(relDay(x.due))}</span>`);
  return`<div class="task ${x.p?'prio-t':''}" id="row-${x.id}" style="--cat:${col}"><div class="task-bg" aria-hidden="true"><span>${ic('check',18)} Fait</span><span>Supprimer ${ic('trash',18)}</span></div><div class="task-fg" data-swipe="${x.id}"><button class="tick" data-a="todoDone" data-v="${x.id}" aria-label="Marquer comme faite">${ic('check',14)}</button><button class="task-main" data-a="todoEdit" data-v="${x.id}"><span class="tt">${x.p?`<span class="prio">${ic('flag',13)}</span> `:''}${esc(x.t)}</span><span class="tm">${meta.join('')}</span></button></div></div>`;
}

function todoDelete(id,row){

let FIRED=new Set();try{FIRED=new Set(JSON.parse(localStorage.getItem('rp-fired')||'[]'))}catch(e){}
function saveFired(){try{localStorage.setItem('rp-fired',JSON.stringify([...FIRED].slice(-300)))}catch(e){}}
const REMQ=[];
function remindAt(t){if(t.d||t.rem==null||!t.due)return null;const[h,m]=(t.time||'09:00').split(':').map(Number),d=parseId(t.due);d.setHours(h,m,0,0);return d.getTime()-(t.rem||0)*6e4}
function checkReminders(){
  const now=Date.now();
  for(const t of S.todos.items||[]){if(t.d)continue;let at=remindAt(t),key=t.id+'@'+at;if(t.snz&&(!at||t.snz>at)){at=t.snz;key=t.id+'@s'+t.snz}if(at==null)continue;
    if(now>=at&&now-at<6*36e5&&!FIRED.has(key)){FIRED.add(key);saveFired();if(!REMQ.find(r=>r.id===t.id))REMQ.push({id:t.id})}}
  if(REMQ.length&&$('#remind').hidden)showRemind();
}
function showRemind(){
  const r=REMQ[0];if(!r)return;const t=(S.todos.items||[]).find(x=>x.id===r.id);if(!t||t.d){REMQ.shift();showRemind();return}
  const el=$('#remind');el.innerHTML=`<span class="bell">${ic('bell',20)}</span><div class="grow"><div class="small">Rappel${t.time?' · '+t.time:''}${t.due&&t.due!==TODAY()?' · '+esc(relDay(t.due)):''}</div><b>${esc(t.t)}</b></div><div class="ra"><button class="chip" data-a="remSnooze">+10 min</button><button class="chip on" data-a="remDone">${ic('check',14)} Fait</button><button class="x" data-a="remClose" aria-label="Fermer le rappel">${ic('x',16)}</button></div>`;
  el.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));try{navigator.vibrate&&navigator.vibrate([90,60,90])}catch(e){}
}
function hideRemind(){const el=$('#remind');el.classList.remove('open');REMQ.shift();setTimeout(()=>{el.hidden=true;if(REMQ.length)showRemind()},450)}

/* ---- import Société Générale (CSV) ---- */
function parseCSVLine(line,sep){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())}
function bankCat(l){const u=norm(l).toUpperCase(),R=[['Alcool',/NICOLAS|V AND B|V&B|CAVISTE|\bCAVE\b/],['Courses',/SUPER U|HYPER U|U EXPRESS|SYSTEME U|CARREFOUR|LECLERC|LIDL|ALDI|INTERMARCHE|AUCHAN|MONOPRIX|CASINO|FRANPRIX|PICARD|BIOCOOP|GRAND FRAIS|BOULANG|NETTO|COCCINELLE|\bSPAR\b/],['Transport',/\bTOTAL\b|ESSO|SHELL|\bBP\b|\bAVIA\b|CARBU|STATION|SNCF|\bTER\b|PEAGE|VINCI|APRR|SANEF|\bASF\b|PARKING|BLABLACAR|INDIGO|IRIGO/],['Sport',/WEFIT|PISCINE|DECATHLON|BASIC.?FIT|FITNESS|INTERSPORT|GO SPORT/],['Santé',/PHARMA|MEDECIN|DOCTEUR|DOCTOLIB|MUTUELLE|CPAM|LABO|DENTIST|OPTIC|KINE|HOPITAL|CLINIQUE/],['Logement',/LOYER|\bEDF\b|ENGIE|TOTALENERGIES|VEOLIA|\bSAUR\b|FREE|ORANGE|\bSFR\b|BOUYGUES|SOSH|ASSURANCE|MAAF|MACIF|MATMUT|\bAXA\b|GROUPAMA|MAIF|ALLIANZ|\bGMF\b/],['Loisirs',/NETFLIX|SPOTIFY|DEEZER|DISNEY|PRIME VIDEO|AMAZON|CINEMA|PATHE|\bCGR\b|FNAC|STEAM|PLAYSTATION|NINTENDO|RESTAU|MC ?DO|MCDONALD|BURGER|\bKFC\b|UBER|DELIVEROO|JUST EAT|\bBAR\b|PIZZ|SUSHI|KEBAB|TABAC|\bPMU\b|\bFDJ\b/]];for(const[c,re]of R)if(re.test(u))return c;return'Autre'}
function parseBank(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());let hi=-1,sep=';';
  for(let i=0;i<Math.min(lines.length,40);i++){const l=norm(lines[i]);if(/date/.test(l)&&/montant|debit|credit/.test(l)){hi=i;sep=lines[i].split(';').length>=lines[i].split(',').length?';':',';break}}
  if(hi<0)return{error:"Je ne trouve pas les colonnes Date, Libellé et Montant dans ce fichier. Vérifie que c'est bien l'export CSV des opérations."};
  const H=parseCSVLine(lines[hi],sep).map(norm),ci=f=>H.findIndex(f);
  const iD=ci(h=>h.includes('date')),iL=ci(h=>h.includes('libelle')),iDt=ci(h=>h.includes('detail')),iM=ci(h=>h.includes('montant')),iDb=ci(h=>h.includes('debit')),iCr=ci(h=>h.includes('credit'));
  const pn=v=>{v=String(v||'').replace(/[\s €]|EUR/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:null};
  const rows=[];let credits=0,bad=0;
  for(const l of lines.slice(hi+1)){const c=parseCSVLine(l,sep),m=String(c[iD]||'').match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(!m){bad++;continue}let y=+m[3];if(y<100)y+=2000;const id=`${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
    let a=null;if(iM>=0)a=pn(c[iM]);else{const db=pn(c[iDb]),cr=pn(c[iCr]);if(db)a=-Math.abs(db);else if(cr)a=Math.abs(cr)}
    if(a==null){bad++;continue}if(a>=0){credits++;continue}
    let lab=[c[iL],iDt>=0?c[iDt]:''].filter(Boolean).join(' ').replace(/\d{8,}/g,'').replace(/CARTE\s+X\s?\d{4}/ig,'').replace(/\b\d{2}\/\d{2}(\/\d{2,4})?\b/g,'').replace(/\s+/g,' ').trim().slice(0,70);
    rows.push({id,l:lab||'Opération bancaire',a:r2(-a),c:bankCat(lab),k:'sg:'+id+':'+r2(-a)+':'+norm(lab).slice(0,20),src:'SG'})}
  if(!rows.length)return{error:"Aucune dépense trouvée dans ce fichier.",credits,bad};
  return{rows,credits,bad};
}
async function readBankFile(f){const buf=await f.arrayBuffer();let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}return txt}

    prev=`<div class="bank-sum"><div><b>${fresh.length}</b><span>nouvelles dépenses</span></div><div><b>${eur(tot)}</b><span>au total</span></div><div><b>${esc(shortDate(ds[0]))}</b><span>→ ${esc(shortDate(ds[ds.length-1]))}</span></div></div>
    <div class="stack">${Object.entries(cats).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<div><div class="between small"><span>${esc(c)}</span><b class="num">${eur(v)}</b></div>${bar(tot?v/tot:0,'full')}</div>`).join('')}</div>
    <p class="hint">${b.rows.length-fresh.length?`${b.rows.length-fresh.length} déjà importées (ignorées). `:''}${b.credits?`${b.credits} crédits ignorés. `:''}Tu pourras corriger une catégorie en supprimant puis ressaisissant la dépense.</p>
    <div class="grid2" style="margin-top:10px"><button class="btn ghost" data-a="bankCancel">Annuler</button><button class="btn" data-a="bankImport" ${fresh.length?'':'disabled'}>${ic('upload',16)} Importer ${fresh.length}</button></div>`}
  return`<section class="card"><h2><span class="h-left">${ic('upload',18)} Relevés Société Générale</span></h2>
  <p class="hint" style="margin-top:0">Société Générale ne propose pas de connexion directe avec Claude. Depuis ton espace client sur le site web, télécharge tes opérations au format CSV, puis importe le fichier ici : chaque dépense est classée automatiquement et ajoutée au budget, sans doublon.</p>
  <label class="btn block ghost" for="bankFile" style="margin-top:12px;cursor:pointer">${ic('upload',18)} Choisir le fichier CSV</label><input type="file" id="bankFile" accept=".csv,.txt,text/csv" data-ch="bank" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  ${prev}</section>`}
async function saveMany(ids){
  for(const id of ids)dirty.set(id,(dirty.get(id)||0)+1);lsSave();if(!S.db)return;setSync('saving');
  for(const id of ids){const v=dirty.get(id),body=()=>JSON.parse(JSON.stringify(S.docs[id]));
    try{await S.db.doc(S.base+'/'+id).set(body());if(dirty.get(id)===v)dirty.delete(id)}
    catch(e){const c=e&&e.code;if(c==='resource_exhausted'||c==='unavailable'){await new Promise(r=>setTimeout(r,1500));try{await S.db.doc(S.base+'/'+id).set(body());dirty.delete(id)}catch(e2){setSync('error');toast("Une partie de l'import n'a pas pu être synchronisée.");return}}else{setSync('error');toast("Import enregistré sur cet appareil, synchronisation impossible.");return}}
    await new Promise(r=>setTimeout(r,60))}
  if(!dirty.size)setSync('ok');
}

let SAMPLE;
async function sampleGet(){if(SAMPLE!==undefined)return SAMPLE;const cl=window.claude;if(!cl||typeof cl.use!=='function'){SAMPLE=null;return SAMPLE}try{SAMPLE=await cl.use('sample')}catch(e){SAMPLE=null}return SAMPLE}
async function toJpeg(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});const m=1600,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(ok,'image/jpeg',.85))}finally{URL.revokeObjectURL(url)}}
function photoErr(e){const c=e&&e.code;
  if(c==='no_sample'||c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')return"L'analyse par Claude n'est pas disponible ici : autorise l'appli à utiliser Claude quand la fenêtre te le propose, ou ouvre-la depuis l'app Claude.";
  if(c==='images_unavailable')return"Cette vue ne permet pas d'envoyer une photo à Claude.";
  if(c==='image_rejected')return"Photo illisible ou trop lourde. Réessaie avec une autre photo.";
  if(c==='rate_limited')return"Trop d'analyses d'affilée. Réessaie dans quelques minutes.";
  if(c==='session_expired')return"Ta session Claude a expiré : reconnecte-toi.";
  return"L'analyse n'a pas abouti. Réessaie avec une photo nette, prise de dessus, avec toute l'assiette dans le cadre.";}
const PHOTO_PROMPT=`Tu es nutritionniste. Voici la photo d'un repas pris en France par l'utilisateur de son appli de suivi.
1. Identifie chaque aliment visible (y compris sauce, huile ou fromage visibles, et la boisson si elle est sur la photo).
2. Estime la quantité de chacun en grammes d'après les proportions (assiette standard d'environ 26 cm, couverts, contenants).
3. Estime ses valeurs nutritionnelles avec les références de la table Ciqual.
Réponds uniquement avec un objet JSON de cette forme :
{"plat":"nom court en français","description":"1 à 2 phrases qui décrivent l'assiette","aliments":[{"nom":"Riz basmati cuit","grammes":150,"kcal":195,"proteines":4,"glucides":42,"lipides":0.5}],"confiance":"faible | moyenne | haute","remarque":"une phrase utile et bienveillante pour un objectif de forme, sans jugement"}
Si la photo ne montre pas de nourriture, réponds {"erreur":"explication courte"}.`;
async function analyzePhoto(file){
  if(S.photo&&S.photo.url)try{URL.revokeObjectURL(S.photo.url)}catch(e){}
  S.photo={url:URL.createObjectURL(file),loading:true,res:null,err:null,m:defaultMeal()};render();
  const sp=await sampleGet();if(!sp){S.photo.loading=false;S.photo.err={code:'no_sample'};render();return}
  try{
    const lim=await sp.limits().catch(()=>null);if(!lim||!lim.images)throw{code:'images_unavailable'};
    let img=file;if(!lim.images.mediaTypes.includes(file.type)||file.size>lim.images.maxInputBytes)img=await toJpeg(file);if(!img)throw{code:'image_rejected'};
    const r=await sp.json(PHOTO_PROMPT,{images:[img],modelTier:'default'});
    if(!r||typeof r!=='object')throw{code:'invalid_json'};
    if(r.erreur){S.photo.err={code:'custom',message:String(r.erreur)}}
    else{const al=(Array.isArray(r.aliments)?r.aliments:[]).map(a=>({nom:String(a&&a.nom||'Aliment').slice(0,60),g:clamp(num(a&&a.grammes),0,3000),kc:clamp(num(a&&a.kcal),0,5000),p:clamp(num(a&&a.proteines),0,500),gl:clamp(num(a&&a.glucides),0,800),l:clamp(num(a&&a.lipides),0,500)})).filter(a=>a.kc>0||a.g>0);
      if(!al.length)throw{code:'invalid_json'};
      S.photo.res={plat:String(r.plat||'Repas').slice(0,70),desc:String(r.description||'').slice(0,300),al,conf:String(r.confiance||'moyenne'),rem:String(r.remarque||'').slice(0,240)};haptic('success')}
  }catch(e){S.photo.err=e||{code:'upstream_error'}}
  S.photo.loading=false;if(S.tab==='food')render();
}

function plan503020(inc,fixed,save){

const IMP_PROMPT=n=>`You are sorting a personal photo library to keep only photos of people.
You receive ${n} contact sheet image${n>1?'s':''}. Each sheet is a 4x4 grid of photos numbered 1 to 16 (white number in the top-left corner of each cell; order: left to right, then top to bottom). Cells without a number are empty: ignore them.
For each numbered photo, decide whether it shows at least one real human being who is clearly visible: a face or a body, any age. Selfies, portraits, group photos, people partly visible, from the side or from behind all count.
Do NOT count: landscapes, nature, sea, sky, buildings, monuments, streets or crowds where no individual is clearly noticeable, animals, food, objects, cars, documents, receipts, screenshots, text, memes, drawings, statues, posters, photos of a TV or computer screen.
When you are unsure, count the photo as showing a person.
Reply with only this JSON: one list per sheet, in order, each holding the numbers of the photos that show a person, for example {"sheets":[[1,4,9],[],[2,3,16]]}. Exactly ${n} lists.`;

async function impClassify(ch){const J=IMP,all=new Set(ch.items.map((_,i)=>i));

    if(J.stop)return new Set();if(J.mode==='all')return all;
    const sm=await impSample();if(!sm){const act=await impPause('nosample');if(act==='retry'){SMP=undefined;continue}if(act==='all')J.mode='all';continue}
    const ctl=new AbortController();J.ctls.add(ctl);
    try{const r=await sm.json(IMP_PROMPT(ch.sheets.length),{images:ch.sheets,modelTier:'quick',signal:ctl.signal});
      const arr=Array.isArray(r)?r:r&&(r.sheets||r.p);if(!Array.isArray(arr)||arr.length!==ch.sheets.length)throw{code:'invalid_json'};

  if(!imgs.length){toast(vids?'Les vidéos ne sont pas gardées : choisis des photos.':'Aucune image dans la sélection.');return}
  const m=imem(),fresh=imgs.filter(f=>!m.sig.has(fSig(f))),skip=imgs.length-fresh.length;

    cap20:!opt.zip&&picked.length===20,zip:!!opt.zip,stop:false,userPause:false,ctls:new Set(),rejects:[],thumbs:[],t0:Date.now(),min:false,upQ:[],view:'run',sel:new Set()};

  const J=IMP;
  if(J.mode==='people'){const sm=await impSample();if(!sm){const act=await impPause('nosample');if(act==='all')J.mode='all';else if(act==='retry')SMP=undefined;else{impFinish();return}}}
  J.P=await impPreset(J.n);J.per=(J.mode==='people'?SMP_MAX:4)*PER_SHEET;

      const slice=J.files.slice(next,next+J.per);next+=slice.length;const items=[];let k=0;

          if(d.hash&&m.rej.has(d.hash)){J.rej++;impMark(it,true);it.tile.width=0;continue}

          if(it.hp)known.push(it.hp);items.push(it)}catch(e){J.fail++}finally{J.dec++;impRender()}}};

    prodDone=true};
  const classifier=async()=>{while(!J.stop){await hold();const ch=ready.shift();if(!ch){if(prodDone&&!clsBusy)break;await pSleep(120);continue}
      clsBusy++;try{const keep=ch.items.length?(J.mode==='people'&&ch.sheets.length?await impClassify(ch):new Set(ch.items.map((_,i)=>i))):new Set();if(J.stop)break;

/* ---- calculs ---- */
const RUCK_FROM='2026-10-19';   // avant : marche rapide sans sac (on garde l'ancien calcul pour l'historique)
const SP_LV={l:[2.8,'Léger'],m:[3.8,'Modéré'],v:[7.5,'Intense']};   // Compendium 2024 : 02024, 02022, 02020
const SP_HINT={abs:{l:'Gainage, crunchs lents, longues pauses',m:'Séries de crunchs, relevés de jambes, pauses courtes',v:'Circuit enchaîné, presque sans pause'},
  push:{l:'Pompes sur les genoux ou contre un banc, longues pauses',m:'Séries de pompes classiques, pauses courtes',v:'Séries enchaînées, presque sans pause'}};
function stepLen(st){return st.stepCm>0?st.stepCm:Math.round(st.cm*0.415)}
function pandolfW(W,L,V,G=0,eta=1){return 1.5*W+2*(W+L)*Math.pow(L/W,2)+eta*(W+L)*(1.5*V*V+0.35*V*G)}
function ruckLoad(d,st){return d.wl!=null?d.wl:(d.date<RUCK_FROM?0:st.loadKg)}
function ruck(d,st){
  const W=st.kg,steps=d.steps||0,sl=stepLen(st),km=steps*sl/100000,L=ruckLoad(d,st);
  let min=d.wmin>0?d.wmin:0,est=false;
  if(!min&&steps){
    if(d.date<RUCK_FROM){const kmh=st.walkKmh,h=km/kmh,met=interp(WALK_MET,kmh);return{steps,km,min:h*60,h,kmh,L:0,kcal:met*W*h,net:(met-1)*W*h,met,watts:0,cad:0,est:true,legacy:true}}
    min=steps/115;est=true}
  const h=min/60,kmh=h>0?km/h:0,V=clamp(kmh,2,8)/3.6,watts=steps&&min?pandolfW(W,L,V):0;
  const kcal=watts*min*60/4184,met=h>0?kcal/(W*h):0;
  return{steps,km,min,h,kmh,L,kcal,net:Math.max(0,kcal-W*h),met,watts,cad:min?steps/min:0,est,legacy:false};
}
function cal(d,st,k){const min=d[k]||0,lv=d[k+'Lv']||st[k+'Lv']||'m',met=(SP_LV[lv]||SP_LV.m)[0],h=min/60;return{min,lv,met,kcal:met*st.kg*h,net:(met-1)*st.kg*h}}
function act(d,st){
  const kg=st.kg,w=ruck(d,st);
  const smin=d.swimMin>0?d.swimMin:((d.swim||0)/100*st.swimPace/60),sh=smin/60,sm=smin*60/st.swimPace*100,sv=6000/st.swimPace,smet=interp(SWIM_MET,sv)*(st.pullBuoy?0.88:1)*(st.poolTemp<=22?1.05:1);
  const gmin=(d.gym&&d.gym.min)||0,gh=gmin/60;
  const s={min:smin,m:sm,h:sh,kcal:smet*kg*sh,net:(smet-1)*kg*sh,met:smet,v:sv},g={min:gmin,kcal:GYM_MET*kg*gh,net:(GYM_MET-1)*kg*gh};
  const ab=cal(d,st,'abs'),pu=cal(d,st,'push');
  return{w,s,g,ab,pu,kcal:w.kcal+s.kcal+g.kcal+ab.kcal+pu.kcal,net:w.net+s.net+g.net+ab.net+pu.net};
}

function diWire(m){if(ZRED())return;m.querySelectorAll('.tile').forEach(el=>{
  const tilt=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.classList.add('tilt');el.style.transform=`perspective(600px) rotateX(${(-y*10).toFixed(2)}deg) rotateY(${(x*10).toFixed(2)}deg) translateY(-2px)`};
  const off=()=>{el.classList.remove('tilt');el.style.transform=''};
  el.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')tilt(e)});el.addEventListener('pointerdown',tilt);
  ['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,off))})}

function applyPalette(){const r=document.documentElement.style;if(r.getPropertyValue('--accent')!=='#2BFF88'){r.setProperty('--accent','#2BFF88');r.setProperty('--hero','#0E2443');r.setProperty('--orb2','#5B8DFF')}}
function applyTheme(){const r=document.documentElement;if(r.dataset.theme!=='dark')r.dataset.theme='dark';if(r.dataset.rpTheme!=='dark')r.dataset.rpTheme='dark';
  const m=document.querySelector('meta[name="theme-color"]');if(m&&m.getAttribute('content')!=='#061325')m.setAttribute('content','#061325')}
applyPalette();applyTheme();

/* ---- réglages : charge du sac et longueur de pas à la place de la natation ; couleurs et apparence retirées ---- */
function v20Settings(){const el=$('#sheet');if(!el||!S.sheet||S.sheet.k!=='settings')return;const st=S.settings;
  el.querySelectorAll('.fgroup').forEach(g=>{const h=g.querySelector('h4'),t=h?h.textContent.trim():'';
    if(t==='Couleurs'||t==='Apparence')g.remove();
    else if(t==='Sport')g.innerHTML=`<h4>Sport</h4><div class="grid2"><label class="field"><span>Charge du sac (kg)</span><input class="inp" id="set-loadKg" data-ch="set" data-k="loadKg" inputmode="decimal" value="${esc(String(st.loadKg).replace('.',','))}"></label><label class="field"><span>Longueur de pas (cm)</span><input class="inp" id="set-stepCm" data-ch="set" data-k="stepCm" inputmode="numeric" value="${st.stepCm>0?st.stepCm:''}" placeholder="Auto : ${i0(Math.round(st.cm*0.415))}"></label></div><p class="hint" style="margin:0">Pour mesurer ta foulée : compte tes pas sur 100 m, puis fais 10 000 ÷ ce nombre. Vide = calcul d'après ta taille.</p>`})}
const _rsV20=renderSheet;renderSheet=function(){_rsV20.apply(this,arguments);v20Settings()};
const _chSetV20=CH.set;CH.set=function(t){const k=t.dataset.k;
  if(k==='loadKg'||k==='stepCm'){let v=num(t.value);v=k==='loadKg'?clamp(r1(v),0,40):(v?clamp(Math.round(v),40,120):0);mutSet(st=>{st[k]=v},false);render();renderSheet();return}
  return _chSetV20(t)};

/* ---- saisies et actions ---- */
function v20Load(x){if(x.wl==null)x.wl=x.date<RUCK_FROM?0:S.settings.loadKg}
function chipSync(a,v,k){document.querySelectorAll(`[data-a="${a}"]${k?`[data-k="${k}"]`:''}`).forEach(c=>c.classList.toggle('on',+c.dataset.v===v))}
Object.assign(IN,{
  steps(t){mutDay(d=>{d.steps=Math.max(0,Math.round(num(t.value)));v20Load(d)},['ruck','sportTotal'])},
  wmin(t){mutDay(d=>{d.wmin=clamp(Math.round(num(t.value)),0,600);v20Load(d)},['ruck','sportTotal']);chipSync('wminSet',day(S.sel).wmin)},
  spMin(t){const k=t.dataset.k;mutDay(d=>{d[k]=clamp(Math.round(num(t.value)),0,300);if(!d[k+'Lv'])d[k+'Lv']=S.settings[k+'Lv']||'m'},[k,'sportTotal']);chipSync('spMinSet',day(S.sel)[k],k)},
});
const _tabV20=ACT.tab;
Object.assign(ACT,{
  tab(t,e){if(t.dataset&&t.dataset.sp)S.spTab=t.dataset.sp;return _tabV20(t,e)},
  spTab(t){const v=t.dataset.v,o=SP_TABS.findIndex(x=>x[0]===spTabNow()),n=SP_TABS.findIndex(x=>x[0]===v);if(n<0||n===o)return;S.spTab=v;haptic();
    const seg=$('#spSeg'),p=$('#spPanel');if(!seg||!p){render();return}
    seg.style.setProperty('--k',n);seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));seg.classList.remove('bounce');void seg.offsetWidth;seg.classList.add('bounce');
    p.innerHTML=spPanel(v);p.classList.remove('from-right','from-left');void p.offsetWidth;p.classList.add(n>o?'from-right':'from-left');countUp(p)},
  ruckSteps(t){mutDay(d=>{d.steps=Math.max(0,(d.steps||0)+ +t.dataset.v);v20Load(d)},['ruck','sportTotal']);const i=$('#steps');if(i)i.value=day(S.sel).steps||''},
  wminStep(t){mutDay(d=>{d.wmin=Math.max(0,(d.wmin||0)+ +t.dataset.v);v20Load(d)},['ruck','sportTotal']);const i=$('#wmin');if(i)i.value=day(S.sel).wmin||'';chipSync('wminSet',day(S.sel).wmin)},
  wminSet(t){const v=+t.dataset.v;mutDay(d=>{d.wmin=d.wmin===v?0:v;v20Load(d)},['ruck','sportTotal']);const i=$('#wmin');if(i)i.value=day(S.sel).wmin||'';chipSync('wminSet',day(S.sel).wmin)},
  spLoad(t){const v=+t.dataset.v;if(S.sel>=RUCK_FROM)mutSet(st=>{st.loadKg=v},false);mutDay(d=>{d.wl=v});toast(v?`Sac de ${v} kg`:'Marche sans sac')},
  spMin(t){const k=t.dataset.k;mutDay(d=>{d[k]=Math.max(0,(d[k]||0)+ +t.dataset.v);if(!d[k+'Lv'])d[k+'Lv']=S.settings[k+'Lv']||'m'},[k,'sportTotal']);const i=$('#sp-'+k);if(i)i.value=day(S.sel)[k]||'';chipSync('spMinSet',day(S.sel)[k],k)},
  spMinSet(t){const k=t.dataset.k,v=+t.dataset.v;mutDay(d=>{d[k]=d[k]===v?0:v;if(!d[k+'Lv'])d[k+'Lv']=S.settings[k+'Lv']||'m'},[k,'sportTotal']);const i=$('#sp-'+k);if(i)i.value=day(S.sel)[k]||'';chipSync('spMinSet',day(S.sel)[k],k);if(day(S.sel)[k]===v)burst(undefined,undefined,10)},
  spLv(t){const k=t.dataset.k,v=t.dataset.v;mutSet(st=>{st[k+'Lv']=v},false);mutDay(d=>{d[k+'Lv']=v})},
  timer(t){const k=t.dataset.v,d=day(S.sel);
    if(d.timer&&d.timer.k===k){const min=Math.max(1,Math.round((Date.now()-d.timer.t0)/6e4)),show=curGym();
      mutDay(x=>{x.timer=null;if(k==='walk'){x.wmin=(x.wmin||0)+min;v20Load(x)}else if(k==='abs'||k==='push'){x[k]=(x[k]||0)+min;if(!x[k+'Lv'])x[k+'Lv']=S.settings[k+'Lv']||'m'}else if(k==='swim'){x.swimMin=Math.round((x.swimMin>0?x.swimMin:0)+min);x.swim=0}else{const g=ensureGym(x,show);g.min=(g.min||0)+min}});
      burst();toast(`${min} min ajoutées`);return}
    if(d.timer&&d.timer.k){toast('Un autre chrono tourne déjà : arrête-le d\'abord.');return}
    mutDay(x=>{x.timer={k,t0:Date.now()}});toast({walk:'Chrono marche lancé',abs:'Chrono abdos lancé',push:'Chrono pompes lancé',swim:'Chrono natation lancé'}[k]||'Chrono salle lancé')},
  palNext(){haptic('success');burst(undefined,undefined,16);const h=document.querySelector('#doitH .doit');if(h&&!ZRED()){const c=h.cloneNode(true);c.classList.remove('ready');h.replaceWith(c);diReady()}toast('DO IT, PIERRE.')},
});

  const m=$('#main'),prevH=m.querySelector(':scope>#doitH'),V={

/* =================== v22 : onglet Nutrition — produits Super U d'abord, bilan calorique ensuite, puis le reste =================== */
function ruckNetPerMin(st){const W=st.kg,L=st.loadKg||0;return Math.max(1,pandolfW(W,L,1.5)*60/4184-W/60)}
function bilanCard(){
  const st=S.settings,d=day(S.sel),n=nutri(d),a=act(d,st),b0=balance(d,st),b={inK:Math.round(b0.inK),out:Math.round(b0.out)},base=bmr(st),daily=base*0.2,mx=Math.max(b.inK,b.out,1),has=n.k>0,diff=b.inK-b.out,def=diff<0;
  const sp=[['ruck','Marche lestée',a.w.net],['abs','Abdos',a.ab.net],['push','Pompes',a.pu.net],['sport','Salle',a.g.net]];if(a.s.net>0)sp.push(['swim','Natation',a.s.net]);
  const tag=!has?'<span class="badge">À remplir</span>':`<span class="badge ${def?'lime':'warn'}">${def?'Déficit':'Excédent'} ${i0(Math.abs(diff))} kcal</span>`;
  const msg=!has?'Ajoute ce que tu manges avec la liste Super U juste au-dessus : ton solde s\'affiche ici.'
    :def?`Déficit de ${i0(-diff)} kcal aujourd'hui, soit environ ${i0(-diff/7.7)} g de graisse en moins (1 kg ≈ 7 700 kcal).`
    :`Excédent de ${i0(diff)} kcal aujourd'hui. Environ ${i0(diff/ruckNetPerMin(st))} min de marche lestée le compenseraient.`;
  return`<section class="card bl-card">
    <h2><span class="h-left">${ic('flame',18)} Bilan calorique</span>${tag}</h2>
    <div class="bl-top">
      <div class="bl-c"><span class="bl-l">${ic('food',13)} Consommé</span><b class="num">${N(b.inK)}</b><small>kcal</small></div>
      <span class="bl-op" aria-hidden="true">−</span>
      <div class="bl-c"><span class="bl-l">${ic('flame',13)} Dépensé</span><b class="num">${N(b.out)}</b><small>kcal</small></div>
      <span class="bl-op" aria-hidden="true">=</span>
      <div class="bl-c bl-res ${has?(def?'good':'over'):''}"><span class="bl-l">Solde</span><b class="num">${has?N(diff,0,true):'—'}</b><small>kcal</small></div>
    </div>
    <div class="bl-bars">
      <div class="bl-bar"><span>Consommé</span><i><u class="in" style="width:${(b.inK/mx*100).toFixed(1)}%"></u></i></div>
      <div class="bl-bar"><span>Dépensé</span><i><u class="out" style="width:${(b.out/mx*100).toFixed(1)}%"></u></i></div>
    </div>
    <div class="bl-det">
      <div><span>Métabolisme de base</span><b>${i0(base)} kcal</b></div>
      <div><span>Vie quotidienne (+20 %)</span><b>${i0(daily)} kcal</b></div>
      ${sp.map(([i,l,v])=>`<div><span>${ic(i,13)} ${l}</span><b>${v>0.5?'+ '+i0(v):'0'} kcal</b></div>`).join('')}
      <div class="bl-tot"><span>Dépense totale</span><b>${i0(b.out)} kcal</b></div>
      ${n.beerK?`<div><span>Dont bière dans le consommé</span><b>${i0(n.beerK)} kcal</b></div>`:''}
    </div>
    <p class="hint" style="margin:10px 0 0">${msg} Objectif repas : ${i0(st.kcalGoal)} kcal.</p>
  </section>`}
function foodView(){
  const parts=vFood().split(/(?=<section)/).map(x=>x.trim()).filter(x=>x.startsWith('<section'));
  const find=t=>parts.find(x=>x.includes(t))||'';
  const add=find('data-live="results"').replace('<span class="h-left">Ajouter un aliment</span>',`<span class="h-left">${ic('food',18)} Produits Super U</span>`);
  const jour=find('>Journal<').replace('cherche un produit ci-dessous','cherche un produit ci-dessus');
  const nut=find('Nutrition du jour');
  const rest=parts.filter(x=>x!==find('data-live="results"')&&x!==find('>Journal<')&&x!==nut).join('');
  return add+bilanCard()+jour+nut+rest+transitCard()+(window.RP_STANDALONE?'':photoCard())+menusCard()}
function render(enter,dir){
  renderChrome();
  const m=$('#main'),prevH=m.querySelector(':scope>#doitH'),V={
    home:()=>{const h=homeFix(vHome()),i=h.indexOf('</section>')+10;return soberCard()+h.slice(0,i)+appsDock()+h.slice(i)+photosCard()+(S.settings.installDone?'':installCard(true))},
    food:foodView,sport:vSport,hyg:vHyg,beer:vSober,traceo:vTraceo,
    photos:()=>impHub()+vPhotos().replace(/<div class="next" style="margin-top:10px;font-size:12.5px">Jusqu'à 600 photos[^<]*<\/div>/,''),
    budget:()=>{const b=vBudget(),i=b.indexOf('</section>')+10;return b.slice(0,i)+bplanCard()+b.slice(i)+bankCard()},
    todo:vTodo};
  TRC.clear();
  m.innerHTML=doitHead(S.tab)+(V[S.tab]||V.home)();
  if(!enter&&prevH&&prevH.dataset.tab===S.tab){const nh=m.querySelector(':scope>#doitH');if(nh)nh.replaceWith(prevH)}else diReady();
  S.flash=null;wireLazy(m);trWire(m);if(typeof zWire==='function')zWire(m);diWire(m);
  if(enter){m.classList.remove('enter','from-r','from-l');void m.offsetWidth;m.classList.add('enter');if(dir)m.classList.add('from-'+dir);[...m.children].forEach((c,i)=>c.style.setProperty('--i',i));countUp(m);clearTimeout(render._t);render._t=setTimeout(()=>m.classList.remove('enter','from-r','from-l'),1500)}
}

/* ---------- boot ---------- */
$('#btn-settings').innerHTML=ic('cog',18);$('#btn-prev').innerHTML=ic('left',18);$('#btn-next').innerHTML=ic('right',18);
lsLoad();
fillDefaults();
const HASH=(location.hash||'').replace('#','').toLowerCase();
if(['sobriete','alcool','zero'].includes(HASH))S.tab='beer';else if(['taches','todo'].includes(HASH))S.tab='todo';else if(['sport','nutrition','budget','hygiene'].includes(HASH))S.tab={sport:'sport',nutrition:'food',budget:'budget',hygiene:'hyg'}[HASH];

setInterval(checkReminders,15000);setTimeout(checkReminders,3500);
setInterval(()=>{if(motivReady()&&Date.now()-S.motivLast>=motivEvery()*1000)showMotiv()},2000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')S.motivLast=Math.max(S.motivLast,Date.now()-motivEvery()*1000+5000)});
